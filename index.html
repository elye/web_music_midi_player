<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDI Visualizer & Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============================================================
     AUDIO CONTEXT OVERLAY
     ============================================================ -->
<div id="audio-overlay" class="hidden">
  <div class="circle">&#9654;</div>
  <p>Click anywhere to enable audio</p>
</div>

<!-- ============================================================
     HEADER / CONTROL BAR
     ============================================================ -->
<div id="header">
  <!-- File -->
  <div class="control-group">
    <span class="control-group-label">File</span>
    <button id="btn-load" class="primary" aria-label="Load MIDI file">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Load MIDI
    </button>
    <input type="file" id="file-input" accept=".mid,.midi" hidden>
    <button id="btn-export" disabled aria-label="Export edited MIDI file">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export
    </button>
  </div>

  <div class="separator"></div>

  <!-- Transport -->
  <div class="control-group">
    <span class="control-group-label">Transport</span>
    <button id="btn-rewind" class="transport-btn" disabled aria-label="Rewind to beginning">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="11 19 2 12 11 5"/><polygon points="22 19 13 12 22 5"/></svg>
    </button>
    <button id="btn-play" class="transport-btn play-btn" disabled aria-label="Play / Pause">
      <svg id="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21"/></svg>
      <svg id="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
    </button>
    <button id="btn-stop" class="transport-btn" disabled aria-label="Stop playback">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
    </button>
  </div>

  <div class="separator"></div>

  <!-- Count-in -->
  <div class="control-group">
    <span class="control-group-label">Count-in</span>
    <input type="number" id="count-in-input" min="0" max="8" value="0" aria-label="Count-in beats" style="width: 50px;">
  </div>

  <div class="separator"></div>

  <!-- Tempo -->
  <div class="control-group">
    <span class="control-group-label">BPM</span>
    <input type="number" id="bpm-input" min="20" max="300" value="120" aria-label="Tempo in BPM">
    <input type="range" id="bpm-slider" min="20" max="300" value="120" aria-label="Tempo slider" style="width: 80px;">
  </div>

  <div class="separator"></div>

  <!-- Transpose -->
  <div class="control-group">
    <span class="control-group-label">Transpose</span>
    <select id="transpose-select" aria-label="Transpose semitones">
      <option value="-12">−12 — Octave Down</option>
      <option value="-11">−11 — Major 7th Down</option>
      <option value="-10">−10 — Minor 7th Down</option>
      <option value="-9">−9 — Major 6th Down</option>
      <option value="-8">−8 — Minor 6th Down</option>
      <option value="-7">−7 — Perfect 5th Down</option>
      <option value="-6">−6 — Tritone Down</option>
      <option value="-5">−5 — Perfect 4th Down</option>
      <option value="-4">−4 — Major 3rd Down</option>
      <option value="-3">−3 — Minor 3rd Down</option>
      <option value="-2">−2 — Major 2nd Down</option>
      <option value="-1">−1 — Minor 2nd Down</option>
      <option value="0" selected>0 — No Transpose</option>
      <option value="1">+1 — Minor 2nd</option>
      <option value="2">+2 — Major 2nd</option>
      <option value="3">+3 — Minor 3rd</option>
      <option value="4">+4 — Major 3rd</option>
      <option value="5">+5 — Perfect 4th</option>
      <option value="6">+6 — Tritone</option>
      <option value="7">+7 — Perfect 5th</option>
      <option value="8">+8 — Minor 6th</option>
      <option value="9">+9 — Major 6th</option>
      <option value="10">+10 — Minor 7th</option>
      <option value="11">+11 — Major 7th</option>
      <option value="12">+12 — Octave Up</option>
    </select>
  </div>

  <button id="btn-reset" class="secondary" disabled aria-label="Reset BPM and transpose to original values">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 105.64-11.36L1 10"/></svg>
    Reset
  </button>

  <div class="separator"></div>

  <!-- Time -->
  <div id="time-display">
    <span class="current-time">00:00.000</span> / <span class="total-time">00:00.000</span>
  </div>
</div>

<!-- Seek bar -->
<div id="seek-bar-container">
  <canvas id="seek-density-canvas"></canvas>
  <div id="seek-progress"></div>
</div>

<!-- ============================================================
     MAIN AREA
     ============================================================ -->
<div id="main">
  <!-- Empty state -->
  <div id="empty-state">
    <div class="icon">♪</div>
    <h2>Load a MIDI File</h2>
    <p>Drag & drop or click <strong>Load MIDI</strong> to get started.<br>Supported formats: <code>.mid</code>, <code>.midi</code></p>
  </div>

  <!-- Loading overlay -->
  <div id="loading-overlay" class="hidden">
    <div class="spinner"></div>
    <span style="color:var(--text-muted); font-size:var(--fs-sm);">Parsing MIDI…</span>
  </div>

  <!-- Visualizers -->
  <div id="visualizers" style="display:none;">
    <div class="viz-panel" id="piano-roll-panel">
      <canvas id="piano-roll-canvas"></canvas>
    </div>
    <div class="viz-panel" id="waterfall-panel">
      <canvas id="waterfall-canvas"></canvas>
    </div>
  </div>
</div>

<!-- Virtual Piano -->
<div id="piano-container">
  <div id="piano"></div>
</div>

<!-- Count-in overlay -->
<div id="count-in-overlay" class="hidden">
  <span id="count-in-beat"></span>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- ============================================================
     SCRIPTS
     ============================================================ -->
<script src="https://unpkg.com/tone@14"></script>
<script src="https://unpkg.com/@tonejs/midi@2"></script>
<script src="app.js"></script>
</body>
</html>
