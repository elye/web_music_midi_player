<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDI Visualizer & Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="stylesheet" href="css/visualizers.css">
<link rel="stylesheet" href="css/piano.css">
</head>
<body>

<!-- ============================================================
     AUDIO CONTEXT OVERLAY
     ============================================================ -->
<div id="audio-overlay" class="hidden">
  <div class="circle">&#9654;</div>
  <p>Click anywhere to enable audio</p>
</div>

<!-- ============================================================
     HEADER / CONTROL BAR
     ============================================================ -->
<div id="header">
  <!-- File -->
  <div class="control-group">
    <span class="control-group-label">File</span>
    <button id="btn-load" class="primary" aria-label="Load MIDI file">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Load MIDI
    </button>
    <input type="file" id="file-input" accept=".mid,.midi" hidden>
    <button id="btn-export" disabled aria-label="Export edited MIDI file">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export
    </button>
  </div>

  <div class="separator"></div>

  <!-- Transport -->
  <div class="control-group">
    <span class="control-group-label">Transport</span>
    <button id="btn-rewind" class="transport-btn" disabled aria-label="Rewind to beginning">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="11 19 2 12 11 5"/><polygon points="22 19 13 12 22 5"/></svg>
    </button>
    <button id="btn-play" class="transport-btn play-btn" disabled aria-label="Play / Pause">
      <svg id="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21"/></svg>
      <svg id="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
    </button>
    <button id="btn-stop" class="transport-btn" disabled aria-label="Stop playback">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
    </button>
  </div>

  <div class="separator"></div>

  <!-- Count-in -->
  <div class="control-group">
    <span class="control-group-label">Count-in</span>
    <input type="number" id="count-in-input" min="0" max="8" value="0" aria-label="Count-in beats" style="width: 50px;">
  </div>

  <div class="separator"></div>

  <!-- Tempo -->
  <div class="control-group">
    <span class="control-group-label">BPM</span>
    <input type="number" id="bpm-input" min="20" max="300" value="120" aria-label="Tempo in BPM">
    <input type="range" id="bpm-slider" min="20" max="300" value="120" aria-label="Tempo slider" style="width: 80px;">
  </div>

  <div class="separator"></div>

  <!-- Transpose -->
  <div class="control-group">
    <span class="control-group-label">Transpose</span>
    <select id="transpose-select" aria-label="Transpose semitones">
      <option value="-12">−12 — Octave Down</option>
      <option value="-11">−11 — Major 7th Down</option>
      <option value="-10">−10 — Minor 7th Down</option>
      <option value="-9">−9 — Major 6th Down</option>
      <option value="-8">−8 — Minor 6th Down</option>
      <option value="-7">−7 — Perfect 5th Down</option>
      <option value="-6">−6 — Tritone Down</option>
      <option value="-5">−5 — Perfect 4th Down</option>
      <option value="-4">−4 — Major 3rd Down</option>
      <option value="-3">−3 — Minor 3rd Down</option>
      <option value="-2">−2 — Major 2nd Down</option>
      <option value="-1">−1 — Minor 2nd Down</option>
      <option value="0" selected>0 — No Transpose</option>
      <option value="1">+1 — Minor 2nd</option>
      <option value="2">+2 — Major 2nd</option>
      <option value="3">+3 — Minor 3rd</option>
      <option value="4">+4 — Major 3rd</option>
      <option value="5">+5 — Perfect 4th</option>
      <option value="6">+6 — Tritone</option>
      <option value="7">+7 — Perfect 5th</option>
      <option value="8">+8 — Minor 6th</option>
      <option value="9">+9 — Major 6th</option>
      <option value="10">+10 — Minor 7th</option>
      <option value="11">+11 — Major 7th</option>
      <option value="12">+12 — Octave Up</option>
    </select>
  </div>

  <button id="btn-reset" class="secondary" disabled aria-label="Reset BPM and transpose to original values">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 105.64-11.36L1 10"/></svg>
    Reset
  </button>

  <div class="separator"></div>

  <!-- Time -->
  <div id="time-display">
    <span class="current-time">00:00.000</span> / <span class="total-time">00:00.000</span>
  </div>

  <div class="separator"></div>

  <!-- Sound preset + Advanced Sound -->
  <div class="control-group">
    <span class="control-group-label">Preset</span>
    <select id="sound-preset" aria-label="Sound preset">
      <option value="">— Preset —</option>
      <option value="Piano" selected>Piano</option>
      <option value="Organ">Organ</option>
      <option value="Guitar">Guitar</option>
      <option value="Brass">Brass</option>
      <option value="Digital">Digital</option>
    </select>
  </div>

  <div class="separator"></div>

  <div class="separator"></div>
        <button id="btn-toggle-piano-roll" class="secondary" aria-label="Show piano roll" title="Show piano roll" aria-pressed="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          Piano Roll
        </button>

  <button id="btn-sound-advanced" class="secondary" type="button" aria-expanded="false" aria-controls="sound-settings-panel">
    Advanced Sound
  </button>

        <button id="btn-fullscreen" class="secondary" aria-label="Toggle fullscreen" title="Toggle fullscreen">
          <svg id="icon-fullscreen-enter" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
          <svg id="icon-fullscreen-exit" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <polyline points="4 14 10 14 10 20"></polyline>
            <polyline points="20 10 14 10 14 4"></polyline>
            <line x1="10" y1="14" x2="3" y2="21"></line>
            <line x1="21" y1="3" x2="14" y2="10"></line>
          </svg>
        </button>
</div>

<div id="sound-settings-wrap">
  <div id="sound-settings-panel" class="hidden" aria-label="Advanced sound settings">
    <div class="sound-control-row">
      <label for="sound-osc-type">Oscillator</label>
      <select id="sound-osc-type" aria-label="Oscillator type">
        <option value="sine" selected>Sine</option>
        <option value="triangle">Triangle</option>
        <option value="sawtooth">Sawtooth</option>
        <option value="square">Square</option>
      </select>
    </div>

    <div class="sound-control-row">
      <label for="sound-attack">Attack (0.001-0.1s)</label>
      <input id="sound-attack" type="range" min="0.001" max="0.1" step="0.001" value="0.003" aria-label="Envelope attack">
      <span id="sound-attack-value">0.003 s</span>
    </div>

    <div class="sound-control-row">
      <label for="sound-decay">Decay (0.05-2s)</label>
      <input id="sound-decay" type="range" min="0.05" max="2" step="0.01" value="0.35" aria-label="Envelope decay">
      <span id="sound-decay-value">0.35 s</span>
    </div>

    <div class="sound-control-row">
      <label for="sound-sustain">Sustain (0-0.9)</label>
      <input id="sound-sustain" type="range" min="0" max="0.9" step="0.01" value="0" aria-label="Envelope sustain">
      <span id="sound-sustain-value">0.00</span>
    </div>

    <div class="sound-control-row">
      <label for="sound-release">Release (0.05-2s)</label>
      <input id="sound-release" type="range" min="0.05" max="2" step="0.01" value="0.6" aria-label="Envelope release">
      <span id="sound-release-value">0.60 s</span>
    </div>

    <div class="sound-control-row">
      <label for="sound-volume">Volume (-24 to 0 dB)</label>
      <input id="sound-volume" type="range" min="-24" max="0" step="1" value="-11" aria-label="Synth volume">
      <span id="sound-volume-value">-11 dB</span>
    </div>
  </div>
</div>

<!-- Seek bar -->
<div id="seek-bar-container">
  <canvas id="seek-density-canvas"></canvas>
  <div id="seek-progress"></div>
</div>

<!-- ============================================================
     MAIN AREA
     ============================================================ -->
<div id="main">
  <!-- Empty state -->
  <div id="empty-state">
    <div class="icon">♪</div>
    <h2>Load a MIDI File</h2>
    <p>Drag & drop or click <strong>Load MIDI</strong> to get started.<br>Supported formats: <code>.mid</code>, <code>.midi</code></p>
  </div>

  <!-- Loading overlay -->
  <div id="loading-overlay" class="hidden">
    <div class="spinner"></div>
    <span style="color:var(--text-muted); font-size:var(--fs-sm);">Parsing MIDI…</span>
  </div>

  <!-- Visualizers -->
  <div id="visualizers" style="display:none;">
    <div class="viz-panel hidden" id="piano-roll-panel">
      <canvas id="piano-roll-canvas"></canvas>
    </div>
    <div class="viz-panel" id="waterfall-panel">
      <canvas id="waterfall-canvas"></canvas>
    </div>
  </div>
</div>

<!-- Virtual Piano -->
<div id="piano-container">
  <div id="piano"></div>
</div>

<!-- Count-in overlay -->
<div id="count-in-overlay" class="hidden">
  <span id="count-in-beat"></span>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- ============================================================
     SCRIPTS
     ============================================================ -->
<script src="js/vendor/tone.js"></script>
<script src="js/vendor/tonejs-midi.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
